name: ci

# The test suite deliberately needs no dataset: every test builds its own fixtures, so CI
# runs in seconds and never downloads the 466 MB SMD archive. Verified by running the suite
# with data/raw removed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest -q
